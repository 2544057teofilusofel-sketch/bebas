<script>
  document.querySelectorAll('.copy').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var text = btn.getAttribute('data-copy');
      var done = function () {
        btn.textContent = 'Tersalin';
        btn.setAttribute('data-done', 'true');
        setTimeout(function () {
          btn.textContent = 'Salin';
          btn.removeAttribute('data-done');
        }, 1600);
      };
      var fallback = function () {
        var el = document.getElementById(btn.getAttribute('data-target'));
        if (el) {
          var r = document.createRange();
          r.selectNodeContents(el);
          var s = window.getSelection();
          s.removeAllRanges();
          s.addRange(r);
        }
      };
      try {
        navigator.clipboard.writeText(text).then(done, fallback);
      } catch (e) {
        fallback();
      }
    });
  });

<script>
const root=document.documentElement;
const themeBtn=document.getElementById('themeBtn');
const menuBtn=document.getElementById('menuBtn');
const navLinks=document.getElementById('navLinks');
const pdfBtn=document.getElementById('pdfBtn');

const savedTheme=localStorage.getItem('kea-theme');
if(savedTheme) root.dataset.theme=savedTheme;
function syncThemeIcon(){themeBtn.textContent=root.dataset.theme==='dark'?'☀':'☾';}
syncThemeIcon();
themeBtn.addEventListener('click',()=>{
  root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';
  localStorage.setItem('kea-theme',root.dataset.theme);
  syncThemeIcon();
});
menuBtn.addEventListener('click',()=>navLinks.classList.toggle('open'));
document.querySelectorAll('.nav-link').forEach(a=>a.addEventListener('click',()=>navLinks.classList.remove('open')));
pdfBtn.addEventListener('click',()=>window.print());

const observer=new IntersectionObserver((entries)=>{entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')})},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>observer.observe(el));

const sections=[...document.querySelectorAll('section[id]')];
const links=[...document.querySelectorAll('.nav-link')];
const sectionObserver=new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+entry.target.id));
    }
  });
},{rootMargin:'-35% 0px -55% 0px',threshold:0});
sections.forEach(s=>sectionObserver.observe(s));
</scr@@ipt>

        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.7), transparent 78%);
      z-index: -2;
    }

    body::after {
      content: "∑   π    f(x)   Σ    x²    ∞";
      position: fixed;
      top: 18%;
      right: -60px;
      font-size: clamp(22px, 3vw, 44px);
      letter-spacing: .8em;
      opacity: .035;
      transform: rotate(-10deg);
      pointer-events: none;
      z-index: -1;
      white-space: nowrap;
    }

    ::selection { background: var(--accent); color: white; }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    img { display: block; max-width: 100%; }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      transform: translateY(-150%);
      background: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 10px;
      z-index: 1000;
    }
    .skip-link:focus { transform: translateY(0); }

    .container { width: min(calc(100% - 32px), var(--container)); margin: 0 auto; }
    .section { padding: 110px 0; position: relative; }
    .section-sm { padding: 72px 0; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent);
      font-size: .76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .16em;
      margin-bottom: 18px;
    }
    .eyebrow::before {
      content: "";
      width: 28px;
      height: 1px;
      background: currentColor;
    }

    h1,h2,h3,p { margin-top: 0; }
    h1 {
      max-width: 760px;
      margin-bottom: 22px;
      font-size: clamp(3.4rem, 7vw, 6.7rem);
      line-height: .94;
      letter-spacing: -.065em;
      font-weight: 820;
    }
    h2 {
      margin-bottom: 16px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.06;
      letter-spacing: -.045em;
    }
    h3 { line-height: 1.15; letter-spacing: -.025em; }
    .lead {
      max-width: 700px;
      color: var(--muted);
      font-size: clamp(1rem, 1.8vw, 1.18rem);
    }

    .glass {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-soft);
    }

    /* Navigation */
    .nav-wrap {
      position: fixed;
      top: 16px;
      left: 0;
      right: 0;
      z-index: 100;
      pointer-events: none;
    }
    .nav {
      width: min(calc(100% - 24px), 1120px);
      margin: 0 auto;
      min-height: 60px;
      border-radius: 999px;
      padding: 8px 10px 8px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 780;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 20px rgba(39,133,216,.25);
      font-size: .82rem;
      font-weight: 900;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-links a {
      padding: 9px 11px;
      border-radius: 999px;
      color: var(--muted);
      font-size: .83rem;
      font-weight: 650;
      transition: all var(--transition);
      position: relative;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--accent-soft); }
    .nav-tools { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 50%;
      cursor: pointer;
      transition: transform var(--transition), background var(--transition);
    }
    .icon-btn:hover { transform: translateY(-2px); background: var(--accent-soft); }
    .menu-btn { display: none; }

    /* Hero */
    .hero { padding-top: 168px; min-height: 100vh; display: grid; place-items: center; }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.18fr .82fr;
      gap: 56px;
      align-items: center;
    }
    .hero-copy { position: relative; z-index: 2; }
    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: .76rem;
      font-weight: 780;
      margin-bottom: 18px;
    }
    .hero-sub { font-size: clamp(1.1rem, 2vw, 1.4rem); font-weight: 680; margin-bottom: 8px; }
    .hero-note { color: var(--muted); max-width: 640px; margin-bottom: 28px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 11px; }
    .btn {
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 11px 15px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-weight: 750;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .btn-primary { background: var(--text); color: var(--bg); border-color: transparent; }
    .btn-secondary { background: var(--surface); color: var(--text); }

    .hero-orbit {
      position: relative;
      min-height: 500px;
      display: grid;
      place-items: center;
    }
    .photo-frame {
      width: min(100%, 390px);
      aspect-ratio: 1 / 1.08;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      background: linear-gradient(145deg, var(--surface-2), var(--surface));
      box-shadow: var(--shadow);
      isolation: isolate;
    }
    .photo-frame::before {
      content: "";
      position: absolute;
      inset: 13px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 27px;
      z-index: 1;
      pointer-events: none;
    }
    .math-hero-card { display: grid; place-items: center; overflow: hidden; }
    .profile-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 24%; z-index: 1; transform: scale(1.015); transition: transform .7s cubic-bezier(.2,.8,.2,1), filter .7s ease; filter: saturate(.82) contrast(1.02); }
    .photo-frame:hover .profile-photo { transform: scale(1.045); filter: saturate(.95) contrast(1.04); }
    .photo-overlay { position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, rgba(7,17,31,.02) 35%, rgba(7,17,31,.18) 65%, rgba(7,17,31,.72) 100%); pointer-events: none; }
    .math-hero-grid { position: absolute; inset: 0; opacity: .16; z-index: 2; background-image: linear-gradient(rgba(255,255,255,.65) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.65) 1px, transparent 1px); background-size: 34px 34px; mask-image: linear-gradient(to bottom, transparent 8%, black 42%, black 100%); pointer-events: none; }
    .math-hero-label { position: absolute; left: 30px; bottom: 26px; z-index: 3; display: flex; gap: 12px; align-items: center; font-size: .7rem; letter-spacing: .12em; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.35); }
    .math-hero-label span { color: #9bd0ff; font-family: ui-monospace, monospace; }
    .math-hero-label strong { font-size: .68rem; }
    .math-hero-card::after { content: ''; position: absolute; inset: 22px; border: 1px solid rgba(255,255,255,.24); border-radius: 25px; pointer-events: none; z-index: 4; }
    .float-math {
      position: absolute;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
      color: var(--muted);
      font-weight: 780;
      font-family: Georgia, serif;
      backdrop-filter: blur(10px);
      animation: drift 6s ease-in-out infinite;
      user-select: none;
    }
    .fm1 { top: 8%; left: 4%; animation-delay: .1s; }
    .fm2 { top: 18%; right: 1%; animation-delay: 1.3s; }
    .fm3 { bottom: 18%; left: 0; animation-delay: 2.2s; }
    .fm4 { bottom: 5%; right: 9%; animation-delay: .8s; }
    .fm5 { top: 46%; right: -6%; animation-delay: 1.9s; }
    @keyframes drift { 50% { transform: translateY(-8px); } }

    .hero-grid-ornament {
      position: absolute;
      inset: 7% 4% auto auto;
      width: 180px;
      height: 180px;
      opacity: .20;
      border: 1px solid var(--border);
      border-radius: 50%;
      box-shadow: inset 0 0 0 28px transparent;
      pointer-events: none;
    }
    .hero-grid-ornament::before, .hero-grid-ornament::after {
      content: "";
      position: absolute;
      inset: 50% 0 auto;
      border-top: 1px solid var(--border);
    }
    .hero-grid-ornament::after { transform: rotate(90deg); }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .stat-card {
      padding: 22px;
      border-radius: var(--radius-sm);
      min-height: 150px;
      position: relative;
      overflow: hidden;
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    .stat-card:hover { transform: translateY(-5px); border-color: rgba(39,133,216,.3); box-shadow: var(--shadow-soft); }
    .stat-value { font-size: clamp(2rem, 4vw, 3rem); font-weight: 820; letter-spacing: -.05em; line-height: 1; margin-bottom: 10px; }
    .stat-label { color: var(--muted); font-size: .88rem; }
    .stat-mark { position: absolute; right: 16px; bottom: 11px; font-family: Georgia, serif; color: var(--accent); opacity: .22; font-size: 3.2rem; }

    /* About */
    .split { display: grid; grid-template-columns: .88fr 1.12fr; gap: 52px; align-items: start; }
    .about-copy p { color: var(--muted); max-width: 600px; }
    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
    .pill { padding: 8px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: .78rem; font-weight: 700; }
    .interest-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .interest-card { padding: 18px; border-radius: 18px; transition: transform var(--transition), background var(--transition); }
    .interest-card:hover { transform: translateY(-4px); background: var(--accent-soft); }
    .mini-icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); margin-bottom: 14px; }
    .interest-card h3 { margin-bottom: 6px; font-size: 1rem; }
    .interest-card p { color: var(--muted); font-size: .84rem; margin: 0; }

    /* Math thinking */
    .math-layout { display: grid; grid-template-columns: 1.08fr .92fr; gap: 28px; align-items: stretch; }
    .math-canvas { min-height: 520px; border-radius: var(--radius); position: relative; overflow: hidden; }
    .math-header { position: absolute; top: 22px; left: 24px; right: 24px; display: flex; justify-content: space-between; gap: 16px; z-index: 2; }
    .math-legend { color: var(--muted); font-size: .78rem; }
    .math-svg { width: 100%; height: 100%; min-height: 520px; display: block; }
    .math-node { cursor: pointer; transition: opacity var(--transition); }
    .math-node circle { fill: var(--surface); stroke: var(--border); stroke-width: 1.6; transition: all var(--transition); }
    .math-node text { fill: var(--text); font-size: 13px; font-weight: 760; pointer-events: none; }
    .math-node:hover circle, .math-node.active circle { stroke: var(--accent); stroke-width: 2.4; filter: drop-shadow(0 8px 15px rgba(39,133,216,.18)); }
    .math-connector { stroke: var(--border); stroke-width: 1.4; transition: stroke var(--transition), opacity var(--transition); }
    .math-connector.active { stroke: var(--accent); opacity: 1; }
    .math-explain { padding: 28px; border-radius: var(--radius); display: flex; flex-direction: column; justify-content: center; }
    .explain-symbol { font-family: Georgia, serif; font-size: 4rem; color: var(--accent); line-height: 1; margin-bottom: 14px; }
    .math-explain h3 { font-size: 1.45rem; margin-bottom: 9px; }
    .math-explain p { color: var(--muted); margin-bottom: 18px; }
    .focus-tag { display: inline-flex; align-items: center; gap: 8px; font-size: .76rem; font-weight: 760; color: var(--accent); }
    .focus-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px var(--accent-soft); }

    /* Achievements + timeline */
    .achievement-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .achievement-card { padding: 24px; border-radius: var(--radius); position: relative; overflow: hidden; transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition); }
    .achievement-card:hover { transform: translateY(-6px); box-shadow: var(--shadow); border-color: rgba(39,133,216,.28); }
    .medal { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); margin-bottom: 20px; }
    .achievement-card h3 { font-size: 1.25rem; margin-bottom: 8px; }
    .achievement-card .meta { color: var(--accent); font-size: .76rem; font-weight: 780; text-transform: uppercase; letter-spacing: .13em; }
    .achievement-card p { color: var(--muted); margin: 10px 0 0; }
    .achievement-card::after { content: attr(data-mark); position: absolute; right: 18px; bottom: -8px; font-family: Georgia, serif; font-size: 5.5rem; opacity: .045; }

    .timeline { position: relative; margin-top: 34px; padding-left: 18px; }
    .timeline::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 1px; background: var(--border); }
    .timeline-item { position: relative; padding: 0 0 26px 28px; }
    .timeline-dot { position: absolute; left: -1px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px var(--accent-soft); }
    .timeline-item button { width: 100%; text-align: left; border: 0; background: transparent; color: inherit; padding: 0; cursor: pointer; }
    .timeline-year { font-size: .76rem; color: var(--accent); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .timeline-title { margin: 5px 0 4px; font-size: 1.02rem; font-weight: 760; }
    .timeline-sub { color: var(--muted); font-size: .86rem; }
    .timeline-detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--transition); }
    .timeline-detail > div { overflow: hidden; }
    .timeline-item.open .timeline-detail { grid-template-rows: 1fr; }
    .timeline-detail p { color: var(--muted); margin: 10px 0 0; max-width: 540px; font-size: .9rem; }

    /* Skills */
    .skills-layout { display: grid; grid-template-columns: .92fr 1.08fr; gap: 34px; }
    .skill-bars { display: grid; gap: 18px; }
    .skill-row { display: grid; gap: 8px; }
    .skill-head { display: flex; justify-content: space-between; gap: 16px; font-weight: 720; font-size: .9rem; }
    .skill-level { color: var(--muted); font-weight: 650; }
    .bar { height: 7px; border-radius: 999px; background: repeating-linear-gradient(90deg, var(--surface-2) 0 9%, transparent 9% 11%); overflow: hidden; }
    .bar span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 700ms cubic-bezier(.22,.61,.36,1); }
    .bar[data-level="strong"] span { width: 78%; }
    .bar[data-level="developing"] span { width: 55%; }
    .skills-note { margin-top: 22px; color: var(--muted); font-size: .82rem; }
    .network { border-radius: var(--radius); min-height: 460px; position: relative; overflow: hidden; }
    .network svg { width: 100%; height: 100%; min-height: 460px; }
    .net-link { stroke: var(--border); stroke-width: 1.2; transition: stroke var(--transition), opacity var(--transition); }
    .net-node { cursor: pointer; }
    .net-node circle { fill: var(--surface-2); stroke: var(--border); stroke-width: 1.3; transition: all var(--transition); }
    .net-node text { fill: var(--text); font-size: 12px; font-weight: 760; pointer-events: none; }
    .net-node:hover circle, .net-node.active circle { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
    .network-tooltip { position: absolute; left: 18px; right: 18px; bottom: 18px; padding: 13px 15px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); font-size: .82rem; pointer-events: none; }
    .network-tooltip strong { color: var(--text); }

    /* Experience / Projects */
    .experience-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .experience-card { padding: 22px; min-height: 250px; border-radius: 22px; transition: transform var(--transition), background var(--transition); }
    .experience-card:hover { transform: translateY(-5px); background: var(--accent-soft); }
    .small-label { font-size: .72rem; color: var(--accent); font-weight: 820; letter-spacing: .13em; text-transform: uppercase; }
    .experience-card h3 { margin: 8px 0 10px; font-size: 1.14rem; }
    .experience-card p { color: var(--muted); font-size: .87rem; }
    .tag-wrap { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; }
    .tag { font-size: .72rem; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); color: var(--muted); }

    .project-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .project-card { min-height: 280px; border-radius: 24px; padding: 22px; position: relative; overflow: hidden; cursor: pointer; }
    .project-card::before { content: ""; position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 1px solid var(--border); right: -90px; top: -90px; opacity: .55; }
    .project-card:hover { border-color: rgba(39,133,216,.28); }
    .project-number { font-size: .76rem; color: var(--accent); font-weight: 800; letter-spacing: .15em; }
    .project-card h3 { font-size: 1.55rem; margin: 22px 0 10px; }
    .project-card p { color: var(--muted); max-width: 450px; }
    .project-open { position: absolute; bottom: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

    /* Interest matrix */
    .interest-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .matrix-card { border-radius: 22px; padding: 24px; }
    .matrix-title { display: flex; justify-content: space-between; gap: 15px; align-items: center; margin-bottom: 14px; }
    .matrix-title span:last-child { font-size: .73rem; padding: 5px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 780; }
    .interest-meter { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
    .interest-meter i { height: 6px; border-radius: 999px; background: var(--surface-2); }
    .interest-meter i.on { background: var(--accent); }
    .matrix-card p { color: var(--muted); font-size: .84rem; margin: 12px 0 0; }

    /* Contact */
    .contact-panel { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; border-radius: 28px; padding: 28px; }
    .contact-main { padding: 20px 10px 20px 4px; }
    .contact-grid { display: grid; gap: 10px; }
    .contact-item { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 15px 16px; border-radius: 14px; background: var(--surface-2); border: 1px solid transparent; transition: border-color var(--transition), transform var(--transition); }
    .contact-item:hover { border-color: var(--border); transform: translateY(-2px); }
    .contact-item small { display: block; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: .68rem; font-weight: 800; }
    .contact-item strong { font-size: .9rem; }
    .contact-arrow { color: var(--accent); }

    footer { padding: 36px 0 60px; color: var(--muted); font-size: .8rem; }
    .footer-inner { border-top: 1px solid var(--border); padding-top: 22px; display: flex; justify-content: space-between; gap: 16px; align-items: center; }

    /* Modal */
    .modal { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; background: rgba(4,10,18,.54); backdrop-filter: blur(8px); z-index: 200; }
    .modal.open { display: grid; animation: fadeIn 180ms ease; }
    .modal-card { width: min(680px, 100%); max-height: 90vh; overflow: auto; border-radius: 24px; padding: 26px; background: var(--bg); border: 1px solid var(--border); box-shadow: var(--shadow); animation: modalIn 220ms ease; }
    .modal-top { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .modal-close { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; color: var(--text); }
    .modal-label { color: var(--accent); text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; font-weight: 820; }
    .modal-card h3 { margin: 7px 0 10px; font-size: 1.8rem; }
    .modal-card p { color: var(--muted); }
    .modal-list { display: grid; gap: 9px; margin-top: 18px; }
    .modal-list div { display: flex; gap: 10px; font-size: .9rem; }
    .modal-list span { color: var(--accent); font-weight: 800; }
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.985) } to { opacity: 1; transform: none } }

    /* Reveal */
    [data-reveal] { opacity: 0; transform: translateY(22px); transition: opacity 700ms ease, transform 700ms ease; }
    [data-reveal].in { opacity: 1; transform: none; }

    /* Cursor */
    @media (pointer: fine) {
      body.cursor-enabled, body.cursor-enabled * { cursor: none !important; }
      .cursor-dot, .cursor-ring { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 1000; opacity: 0; }
      .cursor-dot { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--text); }
      .cursor-ring { width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 1px solid var(--text); border-radius: 50%; transition: width 180ms ease, height 180ms ease, margin 180ms ease, background 180ms ease, opacity 180ms ease; }
      .cursor-ring.hover { width: 42px; height: 42px; margin: -21px 0 0 -21px; background: var(--accent-soft); }
    }

    /* Responsive */
    @media (max-width: 1000px) {
      .nav-links { display: none; position: absolute; top: 72px; left: 0; right: 0; padding: 10px; border-radius: 20px; flex-direction: column; align-items: stretch; }
      .nav.open .nav-links { display: flex; }
      .nav-links a { padding: 12px; }
      .menu-btn { display: grid; }
      .hero-grid, .split, .math-layout, .skills-layout, .contact-panel { grid-template-columns: 1fr; }
      .hero { padding-top: 130px; min-height: auto; padding-bottom: 70px; }
      .hero-orbit { min-height: 450px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .experience-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 700px) {
      .container { width: min(calc(100% - 20px), var(--container)); }
      .section { padding: 80px 0; }
      .section-sm { padding: 56px 0; }
      h1 { font-size: clamp(3rem, 15vw, 4.9rem); }
      .hero-orbit { min-height: 390px; }
      .photo-frame { width: min(100%, 330px); }
      .float-math { font-size: .8rem; padding: 6px 9px; }
      .stats-grid, .achievement-grid, .project-grid, .interest-matrix, .experience-grid, .interest-grid { grid-template-columns: 1fr; }
      .math-canvas, .math-svg, .network, .network svg { min-height: 410px; }
      .contact-panel { padding: 18px; }
      .footer-inner { flex-direction: column; align-items: flex-start; }
      .nav { width: min(calc(100% - 12px), 1120px); }
    }

    @media print {
      :root, html[data-theme="dark"] {
        --bg: #fff;
        --surface: #fff;
        --surface-2: #f3f5f7;
        --text: #111827;
        --muted: #4b5563;
        --accent: #0b4f8a;
        --accent-2: #0b4f8a;
        --accent-soft: rgba(11,79,138,.08);
        --border: #d6dbe1;
        --grid: transparent;
        --shadow: none;
        --shadow-soft: none;
      }
      html { scroll-behavior: auto; }
      body { background: #fff !important; font-size: 11px; }
      body::before, body::after, .nav-wrap, .hero-actions, .float-math, .hero-grid-ornament, .cursor-dot, .cursor-ring, .modal, .project-open, .network-tooltip { display: none !important; }
      .section { padding: 28px 0; }
      .hero { min-height: auto; padding-top: 22px; }
      .hero-grid { grid-template-columns: 1.25fr .75fr; gap: 30px; }
      h1 { font-size: 42px; }
      h2 { font-size: 24px; }
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
      .stat-card, .achievement-card, .experience-card, .project-card, .matrix-card, .contact-panel, .math-canvas, .math-explain, .network { box-shadow: none !important; backdrop-filter: none; background: #fff; }
      .math-layout, .skills-layout, .contact-panel, .split { grid-template-columns: 1fr 1fr; }
      .experience-grid { grid-template-columns: repeat(3, 1fr); }
      .project-grid, .interest-matrix { grid-template-columns: 1fr 1fr; }
      [data-reveal] { opacity: 1 !important; transform: none !important; }
      .bar span { width: auto !important; }
      a[href^="mailto"], a[href^="tel"], a[href*="instagram"] { color: #111827; }
      footer { padding-top: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      [data-reveal] { opacity: 1; transform: none; }
    }
  </style>

  <script>
    (() => {
      'use strict';

      const root = document.documentElement;
      const body = document.body;
      const $ = (selector, scope = document) => scope.querySelector(selector);
      const $$ = (selector, scope = document) => [...scope.querySelectorAll(selector)];

      // Theme
      const savedTheme = localStorage.getItem('mgs-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = savedTheme || (prefersDark ? 'dark' : 'light');
      root.dataset.theme = initialTheme;
      const themeToggle = $('#theme-toggle');
      const updateThemeButton = () => {
        const dark = root.dataset.theme === 'dark';
        themeToggle.textContent = dark ? '☀' : '☾';
        themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
        themeToggle.title = dark ? 'Light mode' : 'Dark mode';
      };
      updateThemeButton();
      themeToggle.addEventListener('click', () => {
        const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
        root.dataset.theme = next;
        localStorage.setItem('mgs-theme', next);
        updateThemeButton();
      });

      // Mobile menu
      const siteNav = $('#site-nav');
      const menuToggle = $('#menu-toggle');
      menuToggle.addEventListener('click', () => {
        const open = siteNav.classList.toggle('open');
        menuToggle.setAttribute('aria-expanded', String(open));
        menuToggle.textContent = open ? '×' : '☰';
      });
      $$('.nav-links a').forEach(link => link.addEventListener('click', () => {
        siteNav.classList.remove('open');
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.textContent = '☰';
      }));

      // Print
      $('#print-btn').addEventListener('click', () => window.print());

      // Scroll reveal
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const revealItems = $$('[data-reveal]');
      if (!prefersReduced && 'IntersectionObserver' in window) {
        const io = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in');
              io.unobserve(entry.target);
            }
          });
        }, { threshold: .12, rootMargin: '0px 0px -35px 0px' });
        revealItems.forEach(el => io.observe(el));
      } else {
        revealItems.forEach(el => el.classList.add('in'));
      }

      // Animated counters
      const counters = $$('.counter');
      const animateCounter = el => {
        const target = Number(el.dataset.target);
        const decimals = Number(el.dataset.decimals || (Number.isInteger(target) ? 0 : 1));
        const suffix = el.dataset.suffix || '';
        const duration = 900;
        const start = performance.now();
        const tick = now => {
          const p = Math.min(1, (now - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = `${(target * eased).toFixed(decimals)}${suffix}`;
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      };
      if ('IntersectionObserver' in window) {
        const counterObs = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) { animateCounter(entry.target); counterObs.unobserve(entry.target); }
          });
        }, { threshold: .5 });
        counters.forEach(el => counterObs.observe(el));
      } else counters.forEach(animateCounter);

      // Active nav section
      const sections = ['home','about','academics','achievements','experience','skills','interests','contact']
        .map(id => document.getElementById(id)).filter(Boolean);
      const navLinks = $$('.nav-links a');
      const navObs = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${entry.target.id}`));
          }
        });
      }, { threshold: .15, rootMargin: '-30% 0px -55% 0px' });
      sections.forEach(sec => navObs.observe(sec));

      // Math thinking interaction
      const mathDescriptions = {
        'Mathematics': ['∑', 'The foundation', 'Learning to recognize structure, reason precisely, and translate questions into solvable forms.'],
        'Logic': ['∴', 'Reasoning structure', 'Connecting assumptions, rules, and conclusions into a coherent chain of thought.'],
        'Pattern Recognition': ['≈', 'Finding structure', 'Noticing repetition, relationships, and regularity before choosing a method.'],
        'Problem Solving': ['→', 'Turning questions into steps', 'Breaking a complex question into smaller, testable decisions and solution paths.'],
        'Quantitative Analysis': ['∫', 'Working with numbers', 'Using numerical relationships and comparisons to turn information into insight.'],
        'Real-world Applications': ['↗', 'Moving beyond the page', 'Connecting mathematical ideas with finance, data, technology, and everyday decisions.'],
        'Insight': ['∞', 'What the process produces', 'A clearer model, stronger explanation, or more useful way of seeing the problem.']
      };
      const explainTitle = $('#math-title');
      const explainDesc = $('#math-description');
      const explainSymbol = $('#math-symbol');
      const mathNodes = $$('.math-node');
      const mathLines = $$('.math-connector');
      const setMathNode = name => {
        mathNodes.forEach(n => n.classList.toggle('active', n.dataset.math === name));
        const data = mathDescriptions[name] || mathDescriptions.Mathematics;
        explainSymbol.textContent = data[0];
        explainTitle.textContent = data[1];
        explainDesc.textContent = data[2];
        mathLines.forEach((line, i) => line.classList.toggle('active', (name !== 'Mathematics' && i % 2 === 0)));
      };
      mathNodes.forEach(node => {
        node.addEventListener('mouseenter', () => setMathNode(node.dataset.math));
        node.addEventListener('focus', () => setMathNode(node.dataset.math));
        node.setAttribute('tabindex', '0');
        node.setAttribute('role', 'button');
        node.addEventListener('click', () => setMathNode(node.dataset.math));
        node.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setMathNode(node.dataset.math); } });
      });

      // Timeline expand/collapse
      $$('#timeline .timeline-item button').forEach(button => {
        button.addEventListener('click', () => {
          const item = button.closest('.timeline-item');
          const open = item.classList.toggle('open');
          button.setAttribute('aria-expanded', String(open));
        });
      });

      // Skill bars
      const skillPanel = $('.skill-bars');
      const skillBars = $$('.bar span', skillPanel);
      const runSkillBars = () => skillBars.forEach(bar => { bar.style.width = ''; });
      if ('IntersectionObserver' in window) {
        const skillObs = new IntersectionObserver(entries => {
          if (entries.some(e => e.isIntersecting)) { runSkillBars(); skillObs.disconnect(); }
        }, { threshold: .2 });
        skillObs.observe(skillPanel);
      } else runSkillBars();

      // Skill network
      const networkDescriptions = {
        Mathematics: 'anchors the network: formulas, structures, and reasoning provide the core language.',
        Logic: 'supports clear chains of reasoning and careful conclusions.',
        'Pattern Recognition': 'helps identify relationships and recurring structures.',
        'Problem Solving': 'turns observations into specific solution paths.',
        Statistics: 'connects numerical observations with interpretation and uncertainty.',
        Finance: 'brings numbers and decisions into a real-world context.',
        Data: 'creates a bridge from raw information to patterns and insight.',
        Technology: 'acts as a tool for analytical exploration and creation.'
      };
      const tooltip = $('#network-tooltip');
      const netNodes = $$('.net-node');
      netNodes.forEach(node => {
        node.addEventListener('mouseenter', () => {
          const name = node.dataset.node;
          netNodes.forEach(n => n.classList.toggle('active', n.dataset.node === name));
          tooltip.innerHTML = `<strong>${name}</strong> ${networkDescriptions[name] || ''}`;
        });
        node.setAttribute('tabindex', '0');
        node.addEventListener('focus', () => node.dispatchEvent(new Event('mouseenter')));
      });

      // Project modal
      const modal = $('#project-modal');
      const closeModal = () => modal.classList.remove('open');
      const modalTitle = $('#modal-title');
      const modalDescription = $('#modal-description');
      const modalSkills = $('#modal-skills');
      const modalConcepts = $('#modal-concepts');
      const modalResult = $('#modal-result');
      const projectData = {
        'Mathematical Problem Solving': ['A placeholder for a real mathematics exploration, competition solution, or reasoning journal.', 'Mathematical reasoning · Logical reasoning', 'Equations · Pattern recognition · Problem solving', 'Replace this line with the real result, solution, or reflection.'],
        'Financial Analysis': ['A placeholder for a real finance-oriented investigation or market analysis.', 'Quantitative thinking · Financial analysis', 'Risk · Comparison · Decision-making', 'Replace this line with the real result, chart, or lesson.'],
        'Data & Quantitative Thinking': ['A placeholder for a real data exercise, visualization, or analytical investigation.', 'Data interpretation · Quantitative thinking', 'Patterns · Comparison · Visualization', 'Replace this line with the real outcome or insight.'],
        'Mathematical Modeling': ['A placeholder for a real-world problem translated into variables, relationships, and a model.', 'Mathematical reasoning · Problem solving', 'Functions · Relationships · Application', 'Replace this line with the real model and conclusion.']
      };
      $$('.project-card').forEach(card => {
        card.addEventListener('click', () => {
          const title = card.dataset.project;
          const data = projectData[title];
          modalTitle.textContent = title;
          modalDescription.textContent = data[0];
          modalSkills.textContent = data[1];
          modalConcepts.textContent = data[2];
          modalResult.textContent = data[3];
          modal.classList.add('open');
          $('#modal-close').focus();
        });
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); } });
      });
      $('#modal-close').addEventListener('click', closeModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

      // Custom cursor: subtle desktop only
      const pointerFine = window.matchMedia('(pointer: fine)').matches;
      const cursorDot = $('#cursor-dot');
      const cursorRing = $('#cursor-ring');
      if (pointerFine && !prefersReducedMotion) {
        body.classList.add('cursor-enabled');
        let tx = 0, ty = 0, rx = 0, ry = 0;
        window.addEventListener('pointermove', e => {
          tx = e.clientX; ty = e.clientY;
          cursorDot.style.opacity = '1'; cursorRing.style.opacity = '1';
          cursorDot.style.transform = `translate(${tx}px, ${ty}px)`;
        }, { passive: true });
        const cursorLoop = () => {
          rx += (tx - rx) * .16;
          ry += (ty - ry) * .16;
          cursorRing.style.transform = `translate(${rx}px, ${ry}px)`;
          requestAnimationFrame(cursorLoop);
        };
        requestAnimationFrame(cursorLoop);
        $$('a, button, .project-card, .net-node, .math-node, .timeline-item button').forEach(el => {
          el.addEventListener('mouseenter', () => cursorRing.classList.add('hover'));
          el.addEventListener('mouseleave', () => cursorRing.classList.remove('hover'));
        });
      }

      // Gentle pointer parallax on hero symbols
      if (pointerFine && !prefersReducedMotion) {
        const floaters = $$('.float-math');
        window.addEventListener('pointermove', e => {
          const x = (e.clientX / window.innerWidth - .5) * 10;
          const y = (e.clientY / window.innerHeight - .5) * 10;
          floaters.forEach((el, i) => {
            const factor = (i + 1) * .22;
            el.style.marginLeft = `${x * factor}px`;
            el.style.marginTop = `${y * factor}px`;
          });
        }, { passive: true });
